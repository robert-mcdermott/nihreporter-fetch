name: Live API checks

# Weekly contract tests against the real NIH RePORTER API, to catch upstream changes
# (criteria, field names, limits) early. NIH asks for large jobs on weekends or overnight (US Eastern).
on:
  schedule:
    - cron: "37 7 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Live tests
        run: uv run -m pytest -q -m live tests/test_live.py
        env:
          NIHREPORTER_FETCH_LIVE: "1"
